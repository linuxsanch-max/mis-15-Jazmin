<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial - Mis 15 Años</title>
    <style>
        /* ================= Estilos (CSS) ================= */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --color-oro: #d4af37;
            --color-oro-brillante: #fcf6ba;
            --color-aguamarina: #0d7c81;
            --color-texto: #333;
            --color-turquesa: #00ced1;
        }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(to bottom, rgba(10, 20, 38, 0.7), rgba(45, 20, 80, 0.8)), 
                        url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1500') center/cover fixed no-repeat;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: var(--color-texto);
            overflow-x: hidden;
        }

        /* SOBRE MÁGICO */
        #sobre-capa {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #081221;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            transition: transform 1.2s ease, opacity 1s ease;
        }

        .sobre {
            position: relative;
            width: 300px; height: 200px;
            background: #1e262c;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .sobre::before, .sobre::after {
            content: ""; position: absolute;
            background: var(--color-turquesa);
            height: 2px; width: 100%;
            top: 50%; left: 0; opacity: 0.5;
        }
        .sobre::before { transform: rotate(33deg); }
        .sobre::after { transform: rotate(-33deg); }

        .sello-lacre {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: radial-gradient(circle, #fcf6ba, #d4af37);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            box-shadow: 0 0 15px var(--color-oro);
            border: 2px solid #b5952f;
        }

        .sello-lacre::after {
            content: "J";
            font-family: 'Great Vibes', cursive;
            font-size: 3rem; color: #8c6a08;
        }

        .sobre-oculto { transform: translateY(-120%); opacity: 0; pointer-events: none; }

        /* CONTENIDO */
        .container {
            max-width: 500px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
            padding-bottom: 50px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid var(--color-oro);
        }

        .title-cursive { font-family: 'Great Vibes', cursive; font-size: 4rem; color: var(--color-aguamarina); margin: 10px 0; }
        .hero-img { width: 100%; border-bottom: 5px solid var(--color-oro); }
        section { padding: 30px 20px; border-bottom: 1px solid #ddd; }
        .btn {
            background: var(--color-aguamarina); color: white;
            padding: 12px 25px; border-radius: 25px; border: none;
            font-weight: bold; cursor: pointer; margin: 10px;
        }
        .btn-oro { background: linear-gradient(135deg, #d4af37, #fcf6ba, #d4af37); color: #4a3b10; }
        
        #miMusica { width: 90%; margin: 20px auto; display: block; }
    </style>
</head>
<body>

<div id="sobre-capa" onclick="abrirSobre()">
    <div class="sobre">
        <div class="sello-lacre"></div>
        <p style="position: absolute; bottom: -60px; width: 100%; color: white;">Toca para abrir la invitación</p>
    </div>
</div>

<div class="container">
    <img src="jazmin-completo.png" alt="Jazmín" class="hero-img">
    <h1 class="title-cursive">Jazmin</h1>
    <h2>Mis 15 Años</h2>

    <section>
        <p><i>"Una noche mágica para celebrar un sueño..."</i></p>
        <audio id="miMusica" controls preload="auto">
            <source src="musica.mp3" type="audio/mpeg">
            <source src="musica.mp3" type="audio/mp3">
            Tu navegador no soporta el audio.
        </audio>
    </section>

    <section>
        <h3>Martes 18 de Agosto 2026</h3>
        <p><b>Recepción:</b> 21:00 hs</p>
        <p>Salón de Eventos Coopejas<br>J. Augusto Saldivar</p>
        <a href="https://maps.google.com/?q=Coopejas+J+Augusto+Saldivar" target="_blank">
            <button class="btn btn-oro">Ver Ubicación 📍</button>
        </a>
    </section>

    <section>
        <h3>Vestimenta</h3>
        <p><b>SPORT ELEGANTE</b></p>
        <p>Color a elección</p>
    </section>

    <section>
        <h3>Confirmar Asistencia</h3>
        <p>Por favor, confirma 15 días antes</p>
        <button class="btn" onclick="window.open('https://wa.me/595982432818?text=Confirmo%20mi%20asistencia')">Confirmar vía WhatsApp</button>
    </section>
</div>

<script>
    function abrirSobre() {
        const capa = document.getElementById('sobre-capa');
        const musica = document.getElementById('miMusica');

        // 1. Ocultar el sobre
        capa.classList.add('sobre-oculto');
        
        // 2. Intentar reproducir la música
        // Ponemos un pequeño retraso para que la animación se vea fluida
        setTimeout(() => {
            musica.play().then(() => {
                console.log("Reproduciendo...");
            }).catch(error => {
                console.log("El navegador bloqueó el inicio automático. Toca Play en el reproductor.");
            });
        }, 500);
    }
</script>

</body>
</html>
