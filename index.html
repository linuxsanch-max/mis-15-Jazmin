<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Jazmín</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap');
        body { margin: 0; background: #081221; font-family: 'Poppins', sans-serif; color: #fff; text-align: center; }
        .sobre-capa { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b1a2d; display: flex; justify-content: center; align-items: center; z-index: 3000; transition: 1s; }
        .sobre { width: 300px; height: 200px; background: #4a148c; position: relative; cursor: pointer; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 2px solid #00e5ff; }
        .sello { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: #d4af37; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 0 20px #fcf6ba; }
        .ocultar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .container { padding: 20px; max-width: 450px; margin: auto; background: white; color: #333; min-height: 100vh; }
        .title { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #0d7c81; margin: 10px 0; }
        .foto { width: 100%; border-radius: 15px; margin: 15px 0; border: 3px solid #d4af37; }
        .reproductor { background: #f1f1f1; padding: 15px; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="sobre-capa" id="capa" onclick="abrir()">
    <div class="sobre">
        <div class="sello">🪔</div>
        <p style="position:absolute; bottom:-60px; width:100%;">Toca la lámpara para abrir</p>
    </div>
</div>

<div class="container">
    <h1 class="title">Jazmín</h1>
    <p>MIS 15 AÑOS</p>
    
    <img src="jazmin-completo.png" class="foto" alt="Jazmín">

    <div class="reproductor">
        <p style="color: #666; font-size: 0.8rem;">Pulsa play si no inicia solo</p>
        <audio id="audio" controls style="width: 100%;">
            <source src="musica.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </div>

    <div style="background: #fff8e1; padding: 20px; border-radius: 15px; border: 1px solid #d4af37;">
        <h3>Martes 18 de Agosto</h3>
        <p>Salón Coopejas - 21:00 hs</p>
    </div>
</div>

<script>
    function abrir() {
        document.getElementById('capa').classList.add('ocultar');
        var audio = document.getElementById('audio');
        // Intentar reproducir con un pequeño retraso
        setTimeout(function() {
            audio.play().catch(function(error) {
                console.log("El navegador bloqueó el auto-play, usa el botón");
            });
        }, 500);
    }
</script>

</body>
</html>
